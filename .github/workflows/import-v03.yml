name: Retired historical v0.3.0 importer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse obsolete archive import
        run: |
          echo 'The one-time v0.3.0 importer is retired. Its unbounded decompression path has been removed.'
          echo 'Current source overlays are qualified by qualify-scalable-routing.yml using tested bounded decoding.'
          echo 'Historical source and failed-import evidence remain available in Git history.'
          exit 1
