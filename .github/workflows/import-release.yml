name: Import and verify prepared release
on:
  push:
    branches: [main]
    paths: ['.publication/ready.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-prepared-release
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack prepared source
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, lzma, pathlib, tarfile
          root = pathlib.Path('.').resolve()
          manifest = json.loads((root / '.publication/ready.json').read_text())
          parts = sorted((root / '.publication').glob('part-*.b64'))
          if len(parts) != 10:
              raise SystemExit('Expected exactly 10 transfer chunks')
          payload = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          if hashlib.sha256(payload).hexdigest() != manifest['archive_sha256']:
              raise SystemExit('Release archive checksum mismatch; no files changed')
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(payload)), mode='r:') as archive:
              members = archive.getmembers()
              expected = set(manifest['members'])
              if len(members) != len(expected) or {m.name for m in members} != expected:
                  raise SystemExit('Unexpected archive members')
              for item in members:
                  p = pathlib.PurePosixPath(item.name)
                  if not item.isfile() or p.is_absolute() or '..' in p.parts or p.parts[0] in ('.git', '.github', '.publication') or item.size > 5_000_000:
                      raise SystemExit('Unsafe archive member')
              for item in members:
                  target = root / item.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(item).read())
          print(f'Imported {len(members)} original files after SHA-256 verification')
          PY
      - name: Run all engine tests and verify standalone build
        run: |
          npm test
          npm run build
          echo 'be83a745173d6af90e64ea370dc9787ffa4bedb748bf826aabf369667a2a7d75  dist/openbumpplan.html' | sha256sum --check
          node scripts/cli.mjs check examples/chiplet-demo.json
          node scripts/cli.mjs check examples/chiplet-optimized.json --fail-on warning
      - name: Reproduce exported deliverables
        run: |
          node scripts/cli.mjs export examples/chiplet-optimized.json docs/demo-map.svg
          node scripts/cli.mjs export examples/chiplet-optimized.json examples/interface-control.pdf
          node scripts/cli.mjs export examples/chiplet-optimized.json examples/interface-control.html
          node scripts/cli.mjs export examples/chiplet-optimized.json examples/interface-control.md
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Run browser workflows and capture actual studio
        run: |
          cp docs/browser-test-results.json "$RUNNER_TEMP/original-browser-test-results.json"
          CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python tests/browser_test.py --chromium "$CHROMIUM_PATH"
          mv docs/browser-test-results.json docs/github-browser-test-results.json
          cp "$RUNNER_TEMP/original-browser-test-results.json" docs/browser-test-results.json
      - name: Commit verified release without rewriting history
        run: |
          rm -r .publication
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github'
          git commit -m 'Publish OpenBumpPlan v0.1.0 source, tests, examples and verified deliverables'
          git push origin HEAD:main
