globalThis.OPENBUMPPLAN_WORKER_SOURCE="\"use strict\";\nconst __mods=Object.create(null);\n__mods[\"src/core/model.js\"] = (()=>{\n/** Canonical, dependency-free model. All geometry is micrometres, right-handed XY. */\nconst VERSION = '0.1.0';\nconst KINDS = ['pad', 'bump', 'interposer', 'ball', 'pcb'];\nconst ROLES = ['any', 'signal', 'clock', 'power', 'ground', 'reserved', 'nc'];\nconst DEFAULT_RULES = Object.freeze({\n  maxLength: 4000, minDomainSpacing: 0, pairMaxDistance: 650, pairMaxSkew: 150,\n  clockShieldRadius: 750, clockGroundMin: 1, groundRadius: 1000,\n  powerRadius: 1400, requirePowerForSignals: false, minGroundRatio: 0.15,\n  crossingWeight: 150, maxCrossings: 0, geometryBudget: 1000000,\n  terminalKind: 'ball', requireCompletePaths: false,\n  allowedStagePairs: [['pad','bump'], ['pad','ball'], ['bump','interposer'],\n    ['bump','ball'], ['interposer','ball'], ['ball','pcb']]\n});\nconst clone = value => structuredClone(value);\nconst rank = kind => KINDS.indexOf(kind);\nconst emptyProject = (name = 'Untitled package') => ({\n  schemaVersion: 1, name, revision: 0, units: 'um', description: '',\n  dies: [], ports: [], connections: [], keepouts: [], regions: [],\n  rules: clone(DEFAULT_RULES), audit: []\n});\nfunction stableStringify(value) {\n  if (Array.isArray(value)) return '[' + value.map(stableStringify).join(',') + ']';\n  if (value && typeof value === 'object') return '{' + Object.keys(value).sort().map(k => JSON.stringify(k) + ':' + stableStringify(value[k])).join(',') + '}';\n  return JSON.stringify(value);\n}\n/** Review identifier, NOT a cryptographic signature or tamper-proof audit. */\nfunction fingerprint(p) {\n  const copy = clone(p); delete copy.audit; delete copy.revision;\n  for (const key of ['dies','ports','connections','keepouts','regions']) copy[key]?.sort((a,b) => a.id.localeCompare(b.id));\n  let h = 2166136261;\n  for (const c of stableStringify(copy)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }\n  return (h >>> 0).toString(16).padStart(8, '0');\n}\nfunction normalizeProject(raw) {\n  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('Project must be a JSON object.');\n  if (raw.schemaVersion !== 1) throw new Error('Unsupported schemaVersion; expected 1.');\n  const p = clone(raw);\n  p.description ??= ''; p.revision ??= 0; p.audit ??= [];\n  for (const key of ['dies','ports','connections','keepouts','regions']) p[key] ??= [];\n  p.rules = { ...clone(DEFAULT_RULES), ...p.rules };\n  p.dies = p.dies.map(d => ({name: d.id, rotation: 0, mirrorX: false, edgeKeepout: 0, cornerKeepout: 0, ...d}));\n  p.ports = p.ports.map(n => ({label: n.id, dieId: '', net: '', domain: '', role: 'any', pair: '', polarity: '', locked: false, required: false, ...n}));\n  p.connections = p.connections.map(e => ({net: '', locked: false, ...e}));\n  p.keepouts = p.keepouts.map(k => ({dieId: '', kinds: clone(KINDS), ...k}));\n  p.regions = p.regions.map(r => ({kind: 'ball', domain: '', minGround: 0, minPower: 0, ...r}));\n  assertProject(p);\n  return p;\n}\nfunction assertProject(p) {\n  const errors = [];\n  const need = (yes, text) => { if (!yes) errors.push(text); };\n  const number = n => typeof n === 'number' && Number.isFinite(n) && Math.abs(n) <= 1e9;\n  const string = s => typeof s === 'string' && s.length <= 512 && !/[\\u0000-\\u001f\\u007f]/.test(s);\n  const array = (a, name, cap) => { need(Array.isArray(a), `${name} must be an array`); if (Array.isArray(a)) need(a.length <= cap, `${name} exceeds the ${cap} item safety limit`); return Array.isArray(a) ? a : []; };\n  need(p.schemaVersion === 1, 'schemaVersion must be 1');\n  need(p.units === 'um', 'Canonical units must be um; use import conversion for mm/nm.');\n  need(string(p.name) && p.name.length > 0, 'name must be a nonempty string of at most 512 characters');\n  need(typeof p.description === 'string' && p.description.length <= 10000, 'description must be text, at most 10000 characters');\n  need(Number.isSafeInteger(p.revision) && p.revision >= 0, 'revision must be a nonnegative integer');\n  const dies = array(p.dies, 'dies', 1000), ports = array(p.ports, 'ports', 10000), edges = array(p.connections, 'connections', 20000);\n  const keepouts = array(p.keepouts, 'keepouts', 1000), regions = array(p.regions, 'regions', 1000);\n  const audit = array(p.audit, 'audit', 200);\n  for (const a of audit) need(a && typeof a === 'object' && typeof a.action === 'string' && typeof a.time === 'string', 'Audit entries need action and time strings');\n  const ids = (items, label) => { const set = new Set(); for (const item of items) {\n    if (!item || typeof item !== 'object' || Array.isArray(item)) { errors.push(`${label} item must be an object`); continue; }\n    need(string(item.id) && item.id.length > 0, `${label} id must be nonempty text`);\n    need(!set.has(item.id), `Duplicate ${label} id: ${item.id}`); set.add(item.id);\n  } return set; };\n  const dieIds = ids(dies, 'die'), portIds = ids(ports, 'port'); ids(edges, 'connection'); ids(keepouts, 'keepout'); ids(regions, 'region');\n  for (const d of dies.filter(Boolean)) {\n    for (const key of ['x','y','width','height','edgeKeepout','cornerKeepout']) need(number(d[key]), `Die ${d.id}: invalid ${key}`);\n    need(d.width > 0 && d.height > 0, `Die ${d.id}: width and height must be positive`);\n    need(d.edgeKeepout >= 0 && d.cornerKeepout >= 0, `Die ${d.id}: keep-outs cannot be negative`);\n    need([0,90,180,270].includes(d.rotation), `Die ${d.id}: rotation must be 0/90/180/270`);\n    need(typeof d.mirrorX === 'boolean', `Die ${d.id}: mirrorX must be boolean`);\n    need(string(d.name), `Die ${d.id}: invalid name`);\n  }\n  for (const n of ports.filter(Boolean)) {\n    need(KINDS.includes(n.kind), `Port ${n.id}: unknown kind ${n.kind}`);\n    need(ROLES.includes(n.role), `Port ${n.id}: unknown role ${n.role}`);\n    need(number(n.x) && number(n.y), `Port ${n.id}: coordinates must be finite numbers`);\n    need(!n.dieId || dieIds.   <aside class="panel right">${inspector()}<div class="section inline"><h3>Rule findings</h3><span class="spacer"></span><select id="issueFilter" aria-label="Filter findings">${option('all','All',issueFilter)}${option('error','Errors',issueFilter)}${option('warning','Warnings',issueFilter)}</select></div>${issueList()}</aside></div>`;}
function inspector(){const n=store.project.ports.find(p=>p.id===selected);if(!n)return `<div class="section"><div class="eyebrow">Inspector</div><h3>Every assignment, explained.</h3><p class="hint">Select a pad, bump, ball, or PCB site. Review inherited nets, move sites, and reassign connections without losing revision history.</p></div>`;
  const p=store.project,ctx=effectiveSignals(p),s=ctx.signals.get(n.id),targets=p.ports.filter(t=>rank(t.kind)>rank(n.kind)&&p.rules.allowedStagePairs.some(([a,b])=>a===n.kind&&b===t.kind));
  return `<div class="section"><div class="eyebrow">Selected ${esc(n.kind)} ${n.locked?'· locked':''}</div><h3 class="inspector-title">${esc(n.id)}</h3><p class="hint" style="margin-bottom:12px">Effective: <strong>${esc(s.net||'(unassigned)')}</strong> / ${esc(s.domain||'no domain')} / ${esc(s.role)}</p><form data-form="port" class="formgrid">${field('Local / package X (um)','x',n.x,'number','step="any" '+(n.locked?'disabled':''))}${field('Local / package Y (um)','y',n.y,'number','step="any" '+(n.locked?'disabled':''))}${field('Declared net (blank = inherit)','net',n.net)}${field('Voltage domain','domain',n.domain)}${selectField('Site role','role',ROLES,n.role)}${field('Display label','label',n.label)}${field('Differential-pair ID','pair',n.pair)}${selectField('Polarity','polarity',[['','None'],['+','+'],['-','-']],n.polarity)}<label class="full"><input type="checkbox" name="required" ${n.required?'checked':''}> Required interface site</label><button class="full" type="submit">Apply site edits</button></form><div class="actions"><button data-action="lock">${n.locked?'Unlock':'Lock site'}</button><button data-action="disconnect" class="danger">Disconnect</button></div>${targets.length?`<form data-form="assign" style="margin-top:16px"><label>Assign to destination<select name="target"><option value="">Select a target…</option>${targets.map(t=>option(t.id,`${t.id}${ctx.incoming.has(t.id)?' · occupied':''}${compatible(n,t,p,ctx)?'':' · incompatible'}`,'',t.locked||strict&&!compatible(n,t,p,ctx))).join('')}</select></label><label style="margin-top:8px"><input name="replace" type="checkbox"> Replace occupied source / target mapping</label><button type="submit" class="primary" style="width:100%;margin-top:9px" ${n.locked?'disabled':''}>Assign connection</button></form>`:''}</div>`;}
function issueList(){const a=store.analysis,items=a.issues.filter(i=>issueFilter==='all'||i.severity===issueFilter);if(!items.length)return `<div class="empty"><div class="symbol">✓</div>No ${issueFilter==='all'?'configured-rule':issueFilter} findings.<br>Planning checks do not replace engineering signoff.</div>`;
  return items.slice(0,150).map((i,index)=>`<button class="issue ${i.severity}" data-issue="${a.issues.indexOf(i)}"><span class="code">${esc(i.code)}</span><span class="message">${esc(i.message)}</span></button>`).join('')+(items.length>150?`<div class="empty">Showing 150 of ${items.length} findings. Export validation JSON for all retained details.</div>`:'');}
function renderMap(){const p=store.project;mapLayout=diagram(p,{view,layers,selected,showLabels:labels,baseline:overlay?baseline:null});$('mapBody').innerHTML=mapLayout.body;if(!viewBox){const b=mapLayout.bounds;viewBox=[b.x,b.y,b.width,b.height];}setViewBox();const svg=$('map');svg.removeEventListener('wheel',zoom);svg.addEventListener('wheel',zoom,{passive:false});svg.onpointerdown=pointerDown;svg.onpointermove=pointerMove;svg.onpointerup=pointerUp;svg.onpointercancel=()=>{drag=null;renderMap();};}
function setViewBox(){if($('map')&&viewBox)$('map').setAttribute('viewBox',viewBox.join(' '));}
function svgPoint(event){const svg=$('map'),point=svg.createSVGPoint();point.x=event.clientX;point.y=event.clientY;return point.matrixTransform(svg.getScreenCTM().inverse());}
function zoom(e){e.preventDefault();const q=svgPoint(e),factor=Math.exp(Math.max(-600,Math.min(600,e.deltaY))*.0015),width=viewBox[2]*factor;if(width<100||width>2000000)return;viewBox=[q.x+(viewBox[0]-q.x)*factor,q.y+(viewBox[1]-q.y)*factor,width,viewBox[3]*factor];setViewBox();}
function pointerDown(e){if(e.button!==0)return;const el=e.target.closest('[data-port]'),id=el?.dataset.port;
  if(id&&mode==='move'){const n=portAt(store.project,id);if(n.locked){toast('This site is locked.',true);return;}drag={type:'move',id,element:el,start:svgPoint(e),node:clone(n),origin:mapLayout.nodes.find(x=>x.id===id),moved:false};$('map').setPointerCapture(e.pointerId);}
  else if(id){drag={type:mode==='connect'?'connect':'select',id,clientX:e.clientX,clientY:e.clientY,moved:false};}
  else{const matrix=$('map').getScreenCTM();drag={type:'pan',clientX:e.clientX,clientY:e.clientY,box:[...viewBox],scaleX:matrix.a,scaleY:matrix.d};$('map').setPointerCapture(e.pointerId);}}
function pointerMove(e){if(!drag)return;
  if(drag.type==='pan'){viewBox=[drag.box[0]-(e.clientX-drag.clientX)/drag.scaleX,drag.box[1]-(e.clientY-drag.clientY)/drag.scaleY,drag.box[2],drag.box[3]];setViewBox();}
  else if(drag.type==='move'){const q=svgPoint(e),dx=q.x-drag.start.x,dy=q.y-drag.start.y;drag.moved=Math.abs(dx)+Math.abs(dy)>1;drag.q={x:drag.origin.sx+dx,y:drag.origin.sy+dy};drag.element.setAttribute('transform',`translate(${dx} ${dy})`);for(const line of $('map').querySelectorAll('[data-edge]')){const edge=store.project.connections.find(x=>x.id===line.dataset.edge);if(edge.from===drag.id){line.setAttribute('x1',drag.q.x);line.setAttribute('y1',drag.q.y);}if(edge.to===drag.id){line.setAttribute('x2',drag.q.x);line.setAttribute('y2',drag.q.y);}}}
  else if(Math.abs(e.clientX-drag.clientX)+Math.abs(e.clientY-drag.clientY)>5)drag.moved=true;
}
function pointerUp(e){if(!drag)return;const d=drag;drag=null;
  if(d.type==='move'){selected=d.id;if(d.moved&&d.q){const world={x:d.q.x-mapLayout.offsets[d.node.kind],y:-d.q.y},local=inversePoint(world,mapLayout.ctx.dies.get(d.node.dieId)),snap=Math.max(0,Number($('snap').value)||0);mutate(`Move ${d.id}`,p=>{const n=portAt(p,d.id);n.x=snap?Math.round(local.x/snap)*snap:local.x;n.y=snap?Math.round(local.y/snap)*snap:local.y;});}render();}
  else if(d.type==='select')selectPort(d.id);
  else if(d.type==='connect'){const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-port]')?.dataset.port;if(d.moved&&hit&&hit!==d.id){selected=d.id;assign(d.id,hit,false);}else if(selected&&selected!==d.id&&rank(portAt(store.project,selected).kind)<rank(portAt(store.project,d.id).kind))assign(selected,d.id,false);else selectPort(d.id);}}
function selectPort(id){selected=id;render();}
function assign(from,to,replace){if(!to){toast('Choose a destination.',true);return;}if(mutate(`Assign ${from} to ${to}`,p=>connect(p,from,to,{replace})))toast('Assignment updated. Undo is available.');}
function connectionsPage(){return `<section class="contentpage"><div class="pageheading"><div><h2>Connectivity, across the stack</h2><p class="hint">Logical nets propagate through every assignment. Declared constraints never silently change.</p></div><span class="spacer"></span><input id="connectionSearch" placeholder="Search a net, domain, or endpoint" aria-label="Search connections" value="${esc(search)}" style="width:280px"><button data-action="export-connections">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Source</th><th>Destination</th><th>Net / pair</th><th>Domain</th><th>Role</th><th>L1 · um</th><th>Locked</th></tr></thead><tbody id="connectionRows"></tbody></table></div><div class="actions"><button data-action="previous-page">Previous</button><span id="tableCount" class="hint"></span><button data-action="next-page">Next</button></div></section>`;}

function renderConnectionRows(){const p=store.project,ctx=effectiveSignals(p),rows=filteredConnections(),pages=Math.max(1,Math.ceil(rows.length/100));tablePage=Math.max(0,Math.min(tablePage,pages-1));$('connectionRows').innerHTML=rows.slice(tablePage*100,(tablePage+1)*100).map(e=>{const s=ctx.signals.get(e.from);return `<tr><td><button class="linkbutton" data-select="${esc(e.from)}">${esc(e.from)}</button></td><td><button class="linkbutton" data-select="${esc(e.to)}">${esc(e.to)}</button></td><td>${esc(s.net||'(unnamed)')}${s.pair?`<br><small>${esc(s.pair)} ${esc(s.polarity)}</small>`:''}</td><td>${esc(s.domain||'—')}</td><td>${esc(s.role)}</td><td>${metricNumber(store.analysis.lengths[e.id])}</td><td><button class="quiet" data-edge-lock="${esc(e.id)}" style="padding:3px 6px;font-size:10px">${e.locked?'Locked':'Unlocked'}</button></td></tr>`;}).join('')||'<tr><td colspan="7">No matching assignments.</td></tr>';$('tableCount').textContent=`Page ${tablePage+1}/${pages} · ${rows.length} matching assignments`;}
const ruleLabels={maxLength:'Maximum assignment L1 (um)',minDomainSpacing:'Different-domain Euclidean spacing (um)',pairMaxDistance:'Pair adjacency, L1 (um)',pairMaxSkew:'Pair L1 skew limit (um)',clockShieldRadius:'Clock ground-neighbour radius (um)',clockGroundMin:'Minimum clock ground neighbours',groundRadius:'Signal ground coverage radius (um)',powerRadius:'Signal power coverage radius (um)',minGroundRatio:'Minimum connected ground fraction (0–1)',crossingWeight:'Crossing cost, um-equivalent',maxCrossings:'Crossing warning threshold',geometryBudget:'Geometry comparison safety budget'};
function rulesPage(){const p=store.project,r=p.rules;return `<section class="contentpage"><div class="pageheading"><div><h2>Explicit constraints. Reproducible checks.</h2><p class="hint">Editing rules re-evaluates the design; it does not automatically repair or approve mappings.</p></div><span class="spacer"></span><button data-action="export-validation">Export findings</button></div><form data-form="rules"><div class="card"><div class="rulegrid">${Object.entries(ruleLabels).map(([key,label])=>field(label,key,r[key],'number','min="0" step="any" required')).join('')}${selectField('Terminal interface layer','terminalKind',KINDS,r.terminalKind)}<label style="padding-top:20px"><input name="requirePowerForSignals" type="checkbox" ${r.requirePowerForSignals?'checked':''}> Enforce domain-matched power coverage</label><label style="padding-top:20px"><input name="requireCompletePaths" type="checkbox" ${r.requireCompletePaths?'checked':''}> Require paths to the terminal layer</label></div><div class="actions"><button type="submit" class="primary">Apply rules and recheck</button></div></div></form><div class="twocol"><div class="card"><h3>Geometric proxies, not electrical signoff</h3><p>Distances use physical package XY. Signal and clock ground neighbours must be connected ground sites on the same layer. A power neighbour must also match the signal’s voltage domain.</p><p>Differential adjacency is L1 distance; ground proximity and voltage-domain spacing are Euclidean. Skew is the difference of L1 assignment lengths within each stage, not measured electrical delay.</p></div><div class="card"><h3>Draft editing and strict checks</h3><p>Strict mapping edits block newly introduced hard-rule violations. Missing assignments, nets, domains, and incomplete pairs/paths may remain while building a draft; they still prevent review readiness.</p><p>Budget exhaustion is an error. Crossings are same-stage straight-ratsnest intersections, not routing shorts. Collinear overlaps are reported separately.</p></div></div><div class="card"><h3>Keep-outs, P/G quotas, and stage topology</h3><p>Edit rectangle keep-outs, die edge/corner distances, per-region power/ground quotas, and allowed forward stages in the complete project JSON. All inputs are validated before use.</p><button data-action="advanced">Edit complete project JSON</button><pre class="mono" style="font-size:11px;white-space:pre-wrap;margin-top:15px">${esc(JSON.stringify({keepouts:p.keepouts,regions:p.regions,allowedStagePairs:r.allowedStagePairs},null,2))}</pre></div></section>`;}
function revisionsPage(){const d=compareProjects(baseline,store.project),s=d.summary;return `<section class="contentpage"><div class="pageheading"><div><h2>Revision review</h2><p class="hint">Baseline ${d.beforeFingerprint} → current ${d.afterFingerprint}. Includes propagated net changes and transformed physical movements.</p></div><span class="spacer"></span><button data-action="baseline-current">Set current as baseline</button><button data-action="baseline-import">Load baseline JSON</button><button data-action="export-diff">Export diff</button></div><div class="revisionstats">${[['Added',s.added],['Removed',s.removed],['Changed',s.changed],['Score delta',metricNumber(s.scoreDelta)]].map(([k,v])=>`<div class="card"><div class="eyebrow">${k}</div><div class="big">${v}</div></div>`).join('')}</div><div class="notice ${d.gate.ok?'':'bad'}">${d.gate.ok?'Regression gate: no newly introduced hard or incomplete-interface errors.':'Regression gate blocked: '+esc(d.gate.reason)} This gate is not a manufacturing approval.</div><div class="tablewrap"><table><thead><tr><th>Change</th><th>Object</th><th>Identifier</th><th>Changed fields</th></tr></thead><tbody>${d.changes.slice(0,500).map(c=>`<tr><td>${c.type}</td><td>${c.category}</td><td>${esc(c.id)}</td><td>${esc(c.fields?.join(', ')||'—')}</td></tr>`).join('')||'<tr><td colspan="4">No structural differences from the baseline.</td></tr>'}</tbody></table></div><div class="card"><h3>Downstream effects · ${d.propagated.length} sites</h3><p>These may change even when a port’s own record does not — for example, after a die rotation or an upstream reassignment.</p><div class="tablewrap"><table><thead><tr><th>Site</th><th>Physical movement, L1 (um)</th><th>Previous net</th><th>Current net</th></tr></thead><tbody>${d.propagated.slice(0,500).map(v=>`<tr><td>${esc(v.id)}</td><td>${metricNumber(v.movement)}</td><td>${esc(v.signalBefore.net)}</td><td>${esc(v.signalAfter.net)}</td></tr>`).join('')||'<tr><td colspan="4">No propagated changes.</td></tr>'}</tbody></table></div></div><p class="hint">Tables show up to 500 entries each; exported diff contains all changes. Local undo/audit records are convenient review aids, not signed approvals.</p></section>`;}
function icdPage(){return `<section class="contentpage"><div class="pageheading"><div><h2>Interface-control document</h2><p class="hint">Mechanical transforms, connectivity, rules, metrics, findings, and approval fields — generated from the current revision.</p></div><span class="spacer"></span><button data-action="export-md">Markdown</button><button data-action="export-html">HTML</button><button class="primary" data-action="export-pdf">Download PDF</button></div><iframe id="icdFrame" class="icdframe" title="Interface-control document preview" sandbox=""></iframe></section>`;}

async function previewImport(){try{const dialog=$('dialog'),value=name=>dialog.querySelector(`[name="${name}"]`).value;const text=$('importText').value||await $('importFile').files[0]?.text();if(!text)throw new Error('Choose a file or paste text.');const type=value('importType'),candidate=clone(store.project);let notes=[];
  if(type==='json')Object.assign(candidate,importJSON(text));
  else if(type==='ports'){const result=importPortsCSV(text,{kind:value('importKind'),dieId:value('importDie'),units:value('importUnits')});candidate.ports.push(...result.ports);notes=result.warnings;}

  const normalized=normalizeProject(candidate),a=analyze(normalized);pendingImport={candidate:normalized,type};$('importPreview').innerHTML=`<div class="notice ${a.errors?'warn':''}">Preview: ${normalized.dies.length} dies, ${normalized.ports.length} sites, ${normalized.connections.length} assignments. ${a.errors} rule errors and ${a.warnings} warnings.${notes.map(n=>`<br>${esc(n)}`).join('')}</div><p class="hint">Import may introduce a draft with rule violations. They remain visible and prevent readiness; no data is automatically repaired.</p>`;$('applyImport').disabled=false;$('dialogError').textContent='';

function helpDialog(){openDialog('Planning workflow','This is an alpha planning application, not a fabrication or signoff tool.',`<div class="card"><h3>1. Load and inspect</h3><p>Start with the synthetic demo, or import CSV/LEF/JSON. CSV requires id,x,y. LEF supports rectangular PIN geometry only. All units are converted to micrometres.</p><h3>2. Assign and constrain</h3><p>Inspect selects sites. Move drags geometry. Connect drags or clicks a source then its target. Use the inspector’s Replace checkbox for occupied mappings. Strict mode blocks new hard violations, but permits explicitly reported incomplete drafts.</p><h3>3. Optimize and review</h3><p>The left panel optimizes one forward stage in a worker. Pair placement and a Hungarian subproblem produce candidates, then full rules validate them. This is a bounded heuristic, not a global coupled optimum.</p><h3>4. Compare and deliver</h3><p>Set a baseline before editing, compare propagated changes, and export the interface document. Save JSON for a lossless checkpoint. CSV formula-leading text is reversibly escaped.</p></div><p>Ctrl/Cmd+Z: undo · Ctrl/Cmd+Shift+Z: redo · F: fit canvas · Escape: cancel dialog · Enter on a focused site: inspect.</p><p>No accounts, telemetry, CDNs, or network uploads. A browser may restrict local storage; export JSON regularly. This tool has no SI/PI/thermal engine and no foundry-qualified signoff.</p>`,`<button data-action="close-dialog" class="primary">Start planning</button>`);}
function download(data,name,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function downloadExport(format){try{const p=store.project,prefix=`openbumpplan-r${p.revision}`;const outputs={json:()=>[exportJSON(p),`${prefix}.json`,'application/json'],ports:()=>[exportPortsCSV(p),`${prefix}-ports.csv`,'text/csv'],connections:()=>[exportConnectionsCSV(p),`${prefix}-assignments.csv`,'text/csv'],svg:()=>[exportSVG(p,{view,layers}),`${prefix}-map.svg`,'image/svg+xml'],pdf:()=>[exportPDF(p),`${prefix}-ICD.pdf`,'application/pdf'],html:()=>[exportICDHTML(p),`${prefix}-ICD.html`,'text/html'],md:()=>[exportICDMarkdown(p),`${prefix}-ICD.md`,'text/markdown'],validation:()=>[JSON.stringify(store.analysis,null,2),`${prefix}-validation.json`,'application/json'],diff:()=>[JSON.stringify(compareProjects(baseline,p),null,2),`${prefix}-diff.json`,'application/json']};if(!outputs[format])throw new Error('Unknown export format.');download(...outputs[format]());toast('Export created from the current revision.');}catch(e){toast(e.message,true);}}
function cancelWorker(){if(worker)worker.terminate();worker=null;if(workerURL)URL.revokeObjectURL(workerURL);workerURL=null;}
function optimize(){if(worker)return;const from=document.querySelector('[name="fromStage"]').value,to=document.querySelector('[name="toStage"]').value,revision=store.project.revision,inputFingerprint=fingerprint(store.project);try{
  if(globalThis.OPENBUMPPLAN_WORKER_SOURCE){workerURL=URL.createObjectURL(new Blob([globalThis.OPENBUMPPLAN_WORKER_SOURCE],{type:'text/javascript'}));worker=new Worker(workerURL);}else worker=new Worker(new URL('./worker.js',import.meta.url),{type:'module'});
  worker.onmessage=event=>{cancelWorker();if(store.project.revision!==revision||fingerprint(store.project)!==inputFingerprint){render();toast('The design changed during optimization. Stale results were discarded.',true);return;}if(!event.data.ok){render();toast(event.data.error,true);return;}const result=event.data.result;if(result.changed){mutate(`Optimize ${from} -> ${to}`,p=>{p.connections=result.project.connections;},{strict:true});toast(`Checked optimization: score ${metricNumber(result.before.metrics.score)} → ${metricNumber(result.after.metrics.score)}; crossings ${result.before.metrics.crossings} → ${result.after.metrics.crossings}.`);}else{render();toast(result.message);}};
  worker.onerror=event=>{cancelWorker();render();toast(`Optimization worker failed: ${event.message}. No design changes were applied.`,true);};
  worker.postMessage({project:clone(store.project),from,to,options:{maxTrials:700}});render();
  }catch(e){cancelWorker();toast(e.message,true);}}
// Delegated handlers survive workspace re-rendering without accumulating listeners.
document.addEventListener('click',async e=>{
  const target=e.target.closest('button');if(!target)return;
  if(target.dataset.tab){tab=target.dataset.tab;render();return;}
  if(target.dataset.mode){mode=target.dataset.mode;render();return;}
  if(target.dataset.die){dieDialog(target.dataset.die);return;}
  if(target.dataset.select){tab='plan';selected=target.dataset.select;render();return;}
  if(target.dataset.edgeLock){mutate(`Toggle lock ${target.dataset.edgeLock}`,p=>{const edge=p.connections.find(x=>x.id===target.dataset.edgeLock);edge.locked=!edge.locked;});return;}
  if(target.dataset.issue!==undefined){const issue=store.analysis.issues[Number(target.dataset.issue)];if(issue.ports[0]){selected=issue.ports[0];render();}else toast(issue.message);return;}
  const action=target.dataset.action;if(!action)return;
  try{
    if(action.startsWith('export-')){downloadExport(action.slice(7));return;}
    if(action==='help')helpDialog();
    else if(action==='new'){if(confirm('Create an empty project? Your current project remains available through Undo.')){selected='';viewBox=null;mutate('Create empty project',p=>Object.assign(p,emptyProject()),{strict:false});}}
    else if(action==='demo'){selected='';viewBox=null;mutate('Load synthetic demonstration',p=>Object.assign(p,demoProject()),{strict:false});}
    else if(action==='import')importDialog();
    else if(action==='preview-import')await previewImport();
    else if(action==='apply-import'&&pendingImport){const importData=pendingImport;selected='';viewBox=null;if(mutate(`Import ${importData.type}`,p=>Object.assign(p,importData.candidate),{strict:false})){closeDialog();toast('Import applied. Review the reported findings before approval.');}}
    else if(action==='close-dialog')closeDialog();
    else if(action==='array')arrayDialog();
    else if(action==='create-array'){const data=Object.fromEntries(new FormData($('arrayForm')));for(const k of ['rows','columns','pitch','x','y'])data[k]=Number(data[k]);const ports=generateArray(data);if(mutate('Generate site array',p=>p.ports.push(...ports))){viewBox=null;closeDialog();render();}}
    else if(action==='apply-die'){const form=$('dieForm'),data=Object.fromEntries(new FormData(form));for(const k of ['x','y','width','height','rotation','edgeKeepout','cornerKeepout'])data[k]=Number(data[k]);data.mirrorX=Boolean(form.elements.mirrorX.checked);if(mutate(`Place die ${form.dataset.id}`,p=>Object.assign(p.dies.find(d=>d.id===form.dataset.id),data))){viewBox=null;closeDialog();render();}}
    else if(action==='advanced')advancedDialog();
    else if(action==='apply-json'){const parsed=importJSON($('projectJSON').value);if(mutate('Apply explicit project JSON edits',p=>Object.assign(p,parsed),{strict:false})){selected='';viewBox=null;closeDialog();render();}}
    else if(action==='undo'||action==='redo'){if(action==='undo')store.undo();else store.redo();if(!store.project.ports.some(n=>n.id===selected))selected='';render();persist();}
    else if(action==='fit'){viewBox=null;renderMap();}
    else if(action==='lock'&&selected)mutate(`Toggle site lock ${selected}`,p=>{const n=portAt(p,selected);n.locked=!n.locked;});
    else if(action==='disconnect'&&selected)mutate(`Disconnect ${selected}`,p=>disconnect(p,selected));
    else if(action==='optimize')optimize();
    else if(action==='cancel-optimize'){cancelWorker();render();toast('Optimization cancelled. No candidate was applied.');}
    else if(action==='previous-page'){tablePage--;renderConnectionRows();}
    else if(action==='next-page'){tablePage++;renderConnectionRows();}
    else if(action==='baseline-current'){baseline=clone(store.project);render();toast('Current revision captured as the review baseline for this session.');}
    else if(action==='baseline-import'){openDialog('Load comparison baseline','The current design will not be changed.',`<input id="baselineFile" type="file" accept=".json">`,`<button data-action="apply-baseline" class="primary">Load baseline</button>`);}
    else if(action==='apply-baseline'){const file=$('baselineFile').files[0];if(!file)throw new Error('Select a baseline JSON file.');baseline=importJSON(await file.text());closeDialog();render();}
  }catch(error){if($('dialog').open)$('dialogError').textContent=error.message;else toast(error.message,true);}
});
document.addEventListener('change',e=>{
  if(e.target.name==='fromStage')fromStage=e.target.value;
  if(e.target.name==='toStage')toStage=e.target.value;
  if(e.target.id==='snap')snapStep=Math.max(0,Number(e.target.value)||0);
  if(e.target.dataset.layer){const kind=e.target.dataset.layer;if(e.target.checked)layers=[...new Set([...layers,kind])];else layers=layers.filter(k=>k!==kind);viewBox=null;render();}
  if(e.target.id==='viewSelect'){view=e.target.value;viewBox=null;render();}
  if(e.target.id==='strictToggle'){strict=e.target.checked;render();if(!strict)toast('Draft mode enabled. Invalid assignments will be reported, not blocked.');}
  if(e.target.id==='labelToggle'){labels=e.target.checked;render();}
  if(e.target.id==='overlayToggle'){overlay=e.target.checked;render();}
  if(e.target.id==='issueFilter'){issueFilter=e.target.value;render();}
  if($('dialog').open&&e.target.closest('#dialog')&&pendingImport){pendingImport=null;if($('applyImport'))$('applyImport').disabled=true;}
});
document.addEventListener('input',e=>{if(e.target.closest('#dialog')&&pendingImport){pendingImport=null;if($('applyImport'))$('applyImport').disabled=true;}});
document.addEventListener('submit',e=>{
  const form=e.target;if(!form.dataset.form)return;e.preventDefault();const data=Object.fromEntries(new FormData(form));
  if(form.dataset.form==='port'){const id=selected;mutate(`Edit site ${id}`,p=>{const n=portAt(p,id);if(!n.locked){n.x=Number(data.x);n.y=Number(data.y);}for(const key of ['net','domain','role','label','pair','polarity'])n[key]=data[key];n.required=Boolean(form.elements.required.checked);});}
  if(form.dataset.form==='assign')assign(selected,data.target,Boolean(form.elements.replace.checked));
  if(form.dataset.form==='rules'){mutate('Update planning constraints',p=>{for(const key of Object.keys(ruleLabels))p.rules[key]=Number(data[key]);p.rules.terminalKind=data.terminalKind;p.rules.requirePowerForSignals=Boolean(form.elements.requirePowerForSignals.checked);p.rules.requireCompletePaths=Boolean(form.elements.requireCompletePaths.checked);},{strict:false});}
});
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||$('dialog').open)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)store.redo();else store.undo();render();persist();}
  else if(e.key.toLowerCase()==='f'&&tab==='plan'){viewBox=null;renderMap();}
  else if(e.key==='Enter'&&e.target.closest('[data-port]')){selectPort(e.target.closest('[data-port]').dataset.port);}
});
window.addEventListener('beforeunload',()=>cancelWorker());
render();persist();if(restoreError)toast(restoreError,true);

return {};
})();
</script>
